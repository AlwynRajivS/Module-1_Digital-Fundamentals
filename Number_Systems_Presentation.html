<script>
const $=s=>document.querySelector(s), bin=(v,n)=>v.toString(2).padStart(n,'0');
const DIG='0123456789ABCDEF';
const SYS={dec:{name:'Decimal',b:10},bin:{name:'Binary',b:2},oct:{name:'Octal',b:8},hex:{name:'Hexadecimal',b:16}};
const KEY={2:'bin',8:'oct',10:'dec',16:'hex'};
const MAXI={2:16,8:6,10:5,16:4}, MAXF={2:12,8:4,10:6,16:3};
const sb=b=>`<sub>${b}</sub>`, T=(s,b)=>`<b>${s}</b>${sb(b)}`;
const allowed=b=>DIG.slice(0,b).split('').join(' ');
const toBig=(s,b)=>[...s].reduce((a,c)=>a*BigInt(b)+BigInt(DIG.indexOf(c)),0n);
const toStr=(n,b)=>n===0n?'0':n.toString(b).toUpperCase();
const dv=c=>DIG.indexOf(c);
const chunk=(s,g)=>s.match(new RegExp('.{'+g+'}','g'))||[];
const S={from:'dec',to:'bin',val:'42.625'};

/* ================= Exact number engine (BigInt) ================= */
function parseNum(str,b,lim=true){
 let s=String(str).replace(/\s+/g,'').toUpperCase(),neg=false;
 if(s[0]==='-'||s[0]==='+'){neg=s[0]==='-';s=s.slice(1)}
 if(!s)return{ok:false,msg:'Type a number to convert.'};
 if((s.match(/\./g)||[]).length>1)return{ok:false,msg:'Use only one radix point.'};
 let [ip,fp='']=s.split('.');
 if(!ip&&!fp)return{ok:false,msg:'Type at least one digit.'};
 const bad=[...(ip+fp)].find(c=>dv(c)<0||dv(c)>=b);
 if(bad)return{ok:false,msg:`"${bad}" is not a valid ${SYS[KEY[b]].name} digit. Allowed digits: ${allowed(b)}.`};
 ip=ip.replace(/^0+(?=.)/,'')||'0';fp=fp.replace(/0+$/,'');
 if(lim){
  if(ip.length>MAXI[b])return{ok:false,msg:`The integer part is limited to ${MAXI[b]} digits so the steps stay readable.`};
  if(fp.length>MAXF[b])return{ok:false,msg:`The fractional part is limited to ${MAXF[b]} digits so the steps stay readable.`};
  if(b===10&&Number(ip)>65535)return{ok:false,msg:'Decimal integers are limited to 65535 (16 bits).'};
 }
 const I=toBig(ip,b),N=toBig(fp||'0',b),D=BigInt(b)**BigInt(fp.length);
 if(I===0n&&N===0n)neg=false;
 return{ok:true,neg,ip,fp,I,N,D,b,txt:(neg?'-':'')+ip+(fp?'.'+fp:'')};
}
/* exact conversion to base tb (used for answers + verification) */
function convExact(p,tb,maxD=16){
 const ints=toStr(p.I,tb);let digits='',num=p.N;
 for(let i=0;i<maxD&&num>0n;i++){const pr=num*BigInt(tb);digits+=DIG[Number(pr/p.D)];num=pr%p.D}
 return{int:ints,frac:digits,trunc:num>0n,str:(p.neg?'-':'')+ints+(digits?'.'+digits:'')};
}
/* exact decimal string of n/d (d must be a power of 2 times 5s? only used with d=2^k) , value < 1 */
function fracDec(n,d){if(n===0n)return'0';let s='',r=n,g=0;while(r>0n&&g++<40){r*=10n;s+=(r/d).toString();r%=d}return'0.'+s}
function verifyTxt(p,fb,tb,ans){
 const q=parseNum(ans,tb,false);if(!q.ok)return'';
 const back=convExact(q,fb,40);
 return(!back.trunc&&back.str===p.txt)?`✔ Check: ${ans}${sb(tb)} converted back to ${SYS[KEY[fb]].name} gives ${p.txt}${sb(fb)} ✓`:'';
}

/* ================= Helpers for slides ================= */
function tbl(head,rows,cur){return `<table><tr>${head.map(x=>`<th>${x}</th>`).join('')}</tr>${rows.map((r,i)=>`<tr class="${i===cur?'cur':''}">${r.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</table>`}
const rt=(head,rows,u)=>tbl(head,rows.slice(0,u+1),u);
const bul=(a,u)=>`<ul class="bl">${a.slice(0,u+1).map((x,i)=>`<li class="${i===u?'cur':''}">${x}</li>`).join('')}</ul>`;
const eq=(h,n)=>`<div class="eq ${n?'new':''}">${h}</div>`;
const LEDW=(s,n)=>`<div class="leds">${Array.from({length:n},(_,k)=>{const i=n-1-k;return`<div class="led ${(s>>i)&1?'hi':''}"><i></i>${2**i}</div>`}).join('')}</div>`;
function strip(rows,vis,hl,ptIdx){
 return `<table class="strip">${rows.slice(0,vis).map(r=>`<tr><th>${r.lab}</th>${r.cells.map((c,i)=>`<td class="${i===ptIdx?'ptd':i===hl?'hc':''}">${c}</td>`).join('')}</tr>`).join('')}</table>`;
}
/* boxes on top, results below (revealed progressively) */
function pstrip(top,bot,nInt,shown,noBot){
 let h='<div class="grp">';
 top.forEach((tp,i)=>{
  if(i===nInt&&top.length>nInt)h+='<div class="ptc">.</div>';
  h+=`<div class="gbox"><div class="gb">${tp}</div>${noBot?'':`<div class="gd ${i===shown-1?'new':''}">${i<shown?bot[i]:'&nbsp;'}</div>`}</div>`;
 });
 return h+'</div>';
}
function refs(g,hl){
 return `<div class="refs">${Array.from({length:2**g},(_,v)=>`<span class="rc ${v===hl?'hl':''}">${bin(v,g)} = ${DIG[v]}</span>`).join('')}</div>`;
}
function ansItems(items,u){
 return items.slice(0,u+1).map((it,i)=>{const nw=i===u;
  return it.k==='ans'?`<div class="ansbox ${nw?'new':''}">${it.h}</div>`:it.k==='chk'?`<p class="chk ${nw?'new':''}">${it.h}</p>`:eq(it.h,nw)}).join('');
}

/* ================= Concept content ================= */
const SYSCARDS=[
 ['Decimal','Base 10 — digits 0 to 9. Each position is a power of 10.','347 = 3×10² + 4×10¹ + 7×10⁰','Everyday counting, money, measurements.','+ Natural for humans. − Not natural for digital hardware.'],
 ['Binary','Base 2 — digits 0 and 1 (each is a bit). Each position is a power of 2.','1011₂ = 1×8 + 0×4 + 1×2 + 1×1 = 11₁₀','All digital circuits, memory, processors and logic gates.','+ Matches two logic levels (LOW/HIGH). − Long to write and read.'],

/* ================= Step-by-step slide generator ================= */
function designSlides(){
 const {f,t,fb,tb,p,hasF,route}=Cv,nm=SYS[f].name,tn=SYS[t].name,sg=p.neg?'-':'';
 const out=[],names=[];
 const add=(name,title,n,fn)=>{names.push(name);out.push({t:`Step ${names.length} · ${title}`,n,st:names.length,f:fn})};
 const g1=fb===8?3:4,g2=tb===8?3:4;

 /* ---- Step 1 : given ---- */
 const methodTxt={
  todec:`Multiply each digit by its place value (${fb}<sup>position</sup>) and add the products.`,
  fromdec:`Divide the integer part repeatedly by ${tb}${hasF?` and multiply the fractional part repeatedly by ${tb}`:''}.`,
  group:`Group the bits in <b>${g2}s</b> — each group is one ${tn} digit.`,
  expand:`Write each ${nm} digit as <b>${g1}</b> binary bits.`,
  via:`Go through binary: ${nm} → Binary (${g1} bits per digit), then Binary → ${tn} (${g2} bits per digit).`}[route];
 add('Given','Given number and method',4,u=>bul([
  `Given: ${T(p.txt,fb)} (${nm}). Convert it to <b>${tn}</b> (base ${tb}).`,
  `Check the digits: a base-${fb} number may use only <b>${allowed(fb)}</b> — every digit of ${p.txt} is valid ✓`,
  (hasF?`Split at the radix point: integer part <b>${p.ip}</b> and fractional part <b>.${p.fp}</b>.`:`There is no radix point, so only the integer method is needed.`)+(p.neg?' The minus sign is set aside and put back at the end.':''),
  `Method: ${methodTxt}`],u));

 /* ====================== TO DECIMAL ====================== */
 if(route==='todec'){
  const ipL=p.ip.length,B=BigInt(fb);
  const cols=[...p.ip].map((c,i)=>({d:c,pos:ipL-1-i})).concat([...p.fp].map((c,i)=>({d:c,pos:-(i+1)})));
  const wS=ps=>ps>=0?(B**BigInt(ps)).toString():fracDec(1n,B**BigInt(-ps));
  const pS=c=>c.pos>=0?(BigInt(dv(c.d))*B**BigInt(c.pos)).toString():fracDec(BigInt(dv(c.d)),B**BigInt(-c.pos));
  const sup=ps=>`${fb}<sup>${ps<0?'−'+(-ps):ps}</sup>`;
  const cells=(fn,pt='')=>{const a=cols.map(fn);if(hasF)a.splice(ipL,0,pt);return a};
  const R=(lab,fn,pt)=>({lab,cells:cells(fn,pt)}),ptI=hasF?ipL:-1;
  add('Positions','Number the positions',4,u=>{
   const rows=[R('Digit',c=>c.d,'.'),R('Position',c=>c.pos<0?'−'+(-c.pos):c.pos),R('Weight',c=>sup(c.pos)),R('Place value',c=>wS(c.pos))];
   const msg=['Write the digits. The radix point separates the integer part (left) from the fractional part (right).',
    'Number the positions: integer digits count 0, 1, 2 … going left from the radix point; fractional digits count −1, −2, −3 … going right.',
    `Every position has a weight: ${fb}<sup>position</sup>.`,
    'Work out each weight as an ordinary decimal number — these are the place values.'][u];
   return strip(rows,u+1,-1,ptI)+`<p class="expl">${msg}</p>`});
  add('Multiply','Multiply digit × place value',cols.length,u=>{
   const letters=fb===16&&cols.some(c=>dv(c.d)>9),c=cols[u];
   const rows=[R('Digit',c=>c.d,'.')];if(letters)rows.push(R('Digit value',c=>dv(c.d)));
   rows.push(R('Place value',c=>wS(c.pos)));rows.push(R('Product',(c,i)=>i<=u?pS(c):''));
   const hl=u+(hasF&&u>=ipL?1:0);
   return strip(rows,rows.length,hl,ptI)+`<p class="expl">Digit <b>${c.d}</b>${dv(c.d)>9?` (= ${dv(c.d)})`:''} at position <b>${c.pos<0?'−'+(-c.pos):c.pos}</b>:</p>`+eq(`${dv(c.d)} × ${wS(c.pos)} = <b>${pS(c)}</b>`,1)});
  const ints=cols.filter(c=>c.pos>=0).map(pS),fracs=cols.filter(c=>c.pos<0).map(pS);
  const Istr=p.I.toString(),Fstr=hasF?fracDec(p.N,p.D):'0',decStr=sg+Istr+(hasF?Fstr.slice(1):'');
  add('Add','Add all the products',hasF?3:1,u=>{
   if(!hasF)return`<p class="expl">Add all the products:</p>`+eq(`${ints.join(' + ')} = <b>${Istr}</b>`,1);
   let h=`<p class="expl">Integer part — add its products:</p>`+eq(`${ints.join(' + ')} = <b>${Istr}</b>`,u===0);
   if(u>=1)h+=`<p class="expl">Fractional part — add its products:</p>`+eq(`${fracs.join(' + ')} = <b>${Fstr}</b>`,u===1);
   if(u>=2)h+=`<p class="expl">Combine both parts:</p>`+eq(`${Istr} + ${Fstr} = <b>${Istr+Fstr.slice(1)}</b>`,1);
   return h});
  add('Answer','Answer',2,u=>ansItems([{k:'ans',h:`${T(p.txt,fb)} = ${T(decStr,10)}`},{k:'chk',h:verifyTxt(p,fb,10,decStr)}].filter(x=>x.h),u));
 }

 /* ====================== FROM DECIMAL ====================== */
 if(route==='fromdec'){
  const t_=BigInt(tb),k=p.fp.length;
  const dr=[];let w=p.I;while(w>0n){dr.push({w,q:w/t_,r:Number(w%t_)});w=w/t_}
  const intRes=dr.length?dr.map(r=>DIG[r.r]).reverse().join(''):'0';
  const fr=[];let num=p.N;
  for(let i=0;i<10&&num>0n;i++){const pr=num*t_;fr.push({num,pr,d:Number(pr/p.D),nn:pr%p.D});num=pr%p.D}
  const trunc=num>0n,fracRes=fr.map(r=>DIG[r.d]).join('');
  const fmt=n=>{const ip=n/p.D,fp=n%p.D;return ip.toString()+(fp>0n?'.'+fp.toString().padStart(k,'0').replace(/0+$/,''):'')};
  add('Integer part',`Integer part: divide by ${tb}`,dr.length?dr.length+1:1,u=>{
   if(!dr.length)return`<p class="expl">The integer part is <b>0</b>, so the integer result is <b>0</b>.</p>`;
   const fin=u===dr.length,shown=fin?dr.length:u+1,sh=dr.slice(0,shown);
   const rows=sh.map(r=>[`${r.w} ÷ ${tb}`,r.q,`<span class="rem">${r.r}${r.r>9?' → '+DIG[r.r]:''}</span>`]);
   const right=fin?`<p class="expl">The quotient is now 0 — stop.<br><b>Read the remainders from bottom to top ↑</b></p><div class="big new">${intRes}</div><p class="mu">${p.I.toString()}${sb(10)} = ${intRes}${sb(tb)}</p>`
    :`<p class="expl">Divide <b>${dr[u].w}</b> by ${tb}: quotient <b>${dr[u].q}</b>, remainder <b class="rem">${dr[u].r}</b>${dr[u].r>9?` (written as <b>${DIG[dr[u].r]}</b>)`:''}.</p><p class="expl">Remainders so far (first = last digit): <b>${sh.map(r=>DIG[r.r]).join(' ')}</b></p><p class="mu">Repeat with the quotient until it becomes 0.</p>`;
   return`<div class="cols"><div>${tbl(['Division','Quotient','Remainder'],rows,fin?-1:shown-1)}</div><div>${right}</div></div>`});
  if(hasF)add('Fraction part',`Fraction part: multiply by ${tb}`,fr.length+1,u=>{
   const fin=u===fr.length,shown=fin?fr.length:u+1,sh=fr.slice(0,shown);
   const rows=sh.map(r=>[fmt(r.num),`× ${tb}`,fmt(r.pr),`<span class="rem">${r.d}${r.d>9?' → '+DIG[r.d]:''}</span>`]);
   const right=fin?`<p class="expl"><b>Read the digits from top to bottom ↓</b><br>${trunc?'The fraction never reaches 0, so we stop after 10 digits — the result is approximate.':'The fraction reached 0 — stop.'}</p><div class="big new">.${fracRes}${trunc?'…':''}</div>`
    :`<p class="expl">Multiply <b>${fmt(fr[u].num)}</b> × ${tb} = <b>${fmt(fr[u].pr)}</b>.<br>The integer part <b class="rem">${fr[u].d}</b>${fr[u].d>9?` (= ${DIG[fr[u].d]})`:''} is the next digit; keep only the fraction <b>${fmt(fr[u].nn)}</b>.</p><p class="expl">Digits so far: <b>.${sh.map(r=>DIG[r.d]).join('')}</b></p>`;
   return`<div class="cols"><div>${tbl(['Fraction','Multiply','Product','Digit'],rows,fin?-1:shown-1)}</div><div>${right}</div></div>`});
  const ansS=intRes+(fracRes?'.'+fracRes:'');
  const items=[{k:'eq',h:`Integer part: ${T(p.I.toString(),10)} = ${T(intRes,tb)}`}];
  if(hasF)items.push({k:'eq',h:`Fraction part: ${T('.'+p.fp,10)} ${trunc?'≈':'='} ${T('.'+fracRes+(trunc?'…':''),tb)}`});
  items.push({k:'ans',h:`${T(p.txt,10)} ${trunc?'≈':'='} ${T(sg+ansS+(trunc?'…':''),tb)}`});
  if(!trunc)items.push({k:'chk',h:verifyTxt(p,10,tb,sg+ansS)});
  add('Answer','Combine the parts: answer',items.length,u=>ansItems(items.filter(x=>x.h),u));
 }

 /* ============ shared builders for grouping / expansion ============ */
 const groupSteps=(rawI,rawF,g,srcTxt)=>{
  const hF=rawF.length>0,padL=(g-rawI.length%g)%g,ipP='0'.repeat(padL)+rawI,intG=chunk(ipP,g);
  const padR=hF?(g-rawF.length%g)%g:0,fpP=rawF+'0'.repeat(padR),fracG=hF?chunk(fpP,g):[];
  const allG=[...intG,...fracG],digs=allG.map(x=>DIG[parseInt(x,2)]),nInt=intG.length;
  const box=i=>{const s=allG[i];
   if(i===0&&padL>0)return`<span class="pad">${s.slice(0,padL)}</span>${s.slice(padL)}`;
   if(i===allG.length-1&&i>=nInt&&padR>0)return`${s.slice(0,g-padR)}<span class="pad">${s.slice(g-padR)}</span>`;
   return s};
  const grouping=u=>{
   const msgs=[`${srcTxt} Start at the radix point and work outwards.`,
    `<b>Integer part:</b> group from the <b>right</b> in ${g}s${padL?`; add <b class="pt">${padL}</b> zero${padL>1?'s':''} on the <b>left</b> (amber) to complete the first group.`:' — no padding is needed.'}`,
    `<b>Fractional part:</b> group from the <b>left</b> in ${g}s${padR?`; add <b class="pt">${padR}</b> zero${padR>1?'s':''} on the <b>right</b> (amber) to complete the last group.`:' — no padding is needed.'}`];
   let vis;
   if(u===0)vis=`<div class="grp"><div class="gb" style="font-size:2.6rem">${rawI}${hF?`<span class="pt">.</span>${rawF}`:''}</div></div>`;
   else if(u===1)vis=pstrip([...intG.map((_,i)=>box(i)),...(hF?[`<span style="opacity:.6">${rawF}</span>`]:[])],[],nInt,0,true);
   else vis=pstrip(allG.map((_,i)=>box(i)),[],nInt,0,true);
   return vis+`<p class="expl">${msgs[u]}</p>`};
  const convert=u=>pstrip(allG.map((_,i)=>box(i)),digs,nInt,u+1)+`<p class="expl">Group <b>${allG[u]}</b>${sb(2)} = ${parseInt(allG[u],2)}${sb(10)} → digit <b class="rem">${digs[u]}</b></p>`+refs(g,parseInt(allG[u],2));
  return{grouping,convert,nG:allG.length,digs,nInt,gn:hF?3:2,rawD:digs.slice(0,nInt).join('')+(hF?'.'+digs.slice(nInt).join(''):'')};
 };
 const expandStep=(g)=>{
  const top=[...p.ip,...p.fp],bot=top.map(d=>bin(dv(d),g)),nI=p.ip.length;
  const rawI=bot.slice(0,nI).join(''),rawF=bot.slice(nI).join('');
  const fn=u=>pstrip(top,bot,nI,u+1)+`<p class="expl">Digit <b>${top[u]}</b>${dv(top[u])>9?` (= ${dv(top[u])})`:''} → <b class="rem">${bot[u]}</b>${sb(2)} (${g} bits)</p>`+refs(g,dv(top[u]));
  return{fn,n:top.length,rawI,rawF};
 };
 const fin=(rawI,rawF)=>{const fi=rawI.replace(/^0+(?=.)/,''),ff=rawF.replace(/0+$/,'');return{fi,ff,str:fi+(ff?'.'+ff:''),raw:rawI+(rawF?'.'+rawF:'')}};

 /* ====================== BINARY -> OCT / HEX (grouping) ====================== */
 if(route==='group'){
  const G=groupSteps(p.ip,p.fp,g2,'The binary number is shown below.');
  add('Group bits',`Make groups of ${g2} bits`,G.gn,G.grouping);
  add('Convert groups','Convert each group to a digit',G.nG,G.convert);
  const ansS=G.rawD;
  const items=[{k:'eq',h:`Write the digits in order and put the radix point back: <b>${ansS}</b>`},{k:'ans',h:`${T(p.txt,2)} = ${T(sg+ansS,tb)}`},{k:'chk',h:verifyTxt(p,2,tb,sg+ansS)}];
  add('Answer','Answer',3,u=>ansItems(items.filter(x=>x.h),u));
 }
 /* ====================== OCT / HEX -> BINARY (expansion) ====================== */
 if(route==='expand'){
  const E=expandStep(g1),F=fin(E.rawI,E.rawF);
  add('Expand digits',`Replace each digit by ${g1} bits`,E.n,E.fn);
  const items=[{k:'eq',h:`Join the bit groups, keeping the radix point: <b>${E.rawI+(E.rawF?'.'+E.rawF:'')}</b>`}];
  if(F.raw!==F.str)items.push({k:'eq',h:`Drop the unneeded zeros (leading zeros of the integer part, trailing zeros of the fraction): <b>${F.str}</b>`});
  items.push({k:'ans',h:`${T(p.txt,fb)} = ${T(sg+F.str,2)}`},{k:'chk',h:verifyTxt(p,fb,2,sg+F.str)});
  add('Answer','Answer',items.filter(x=>x.h).length,u=>ansItems(items.filter(x=>x.h),u));
 }
 /* ====================== OCT <-> HEX (through binary) ====================== */
 if(route==='via'){
  const E=expandStep(g1);
  add('To binary',`Each digit to ${g1} bits (binary)`,E.n,E.fn);
  const G=groupSteps(E.rawI,E.rawF,g2,`All the bits joined: <b>${E.rawI+(E.rawF?'.'+E.rawF:'')}</b>${sb(2)}.`);
  add('Regroup',`Regroup the bits in ${g2}s`,G.gn,G.grouping);
  add('Convert groups','Convert each group to a digit',G.nG,G.convert);
  const ni=G.nInt,rI=G.digs.slice(0,ni).join(''),rF=G.digs.slice(ni).join(''),F=fin(rI,rF);
  const items=[{k:'eq',h:`Write the digits in order: <b>${G.rawD}</b>`}];
  if(F.raw!==F.str)items.push({k:'eq',h:`Drop the unneeded zeros: <b>${F.str}</b>`});
  items.push({k:'ans',h:`${T(p.txt,fb)} = ${T(sg+F.str,tb)}`},{k:'chk',h:verifyTxt(p,fb,tb,sg+F.str)});
  add('Answer','Answer',items.filter(x=>x.h).length,u=>ansItems(items.filter(x=>x.h),u));
 }

 Cv.names=names;Cv.answer=convExact(p,tb);

 /* ---- closing slides ---- */
 const QC=[['1011','bin','dec'],['75','dec','bin'],['2F','hex','dec'],['157','oct','bin'],['10.625','dec','bin'],['A.8','hex','dec'],['11110000','bin','hex'],['57','oct','hex']]
  .map(([v,a,b])=>[`${v}${sb(SYS[a].b)}`,SYS[b].name,`<b>${convExact(parseNum(v,SYS[a].b,false),SYS[b].b).str}</b>${sb(SYS[b].b)}`]);
 out.push({t:'Quick Check · Try These',n:QC.length,f:u=>rt(['Convert','To','Answer'],QC,u)});
 out.push({t:'Summary',n:1,f:()=>`<p style="font-size:1.4rem">Your conversion:</p><div class="eq">${T(p.txt,fb)} ${Cv.answer.trunc?'≈':'='} ${T(Cv.answer.str+(Cv.answer.trunc?'…':''),tb)}</div>
  <ul class="bl" style="margin-top:.6rem"><li style="font-size:1.4rem;margin:8px 0">A number system with base <b>b</b> uses digits 0 … b−1; each position has weight b<sup>position</sup>.</li>
  <li style="font-size:1.4rem;margin:8px 0"><b>To decimal:</b> add digit × place value.  <b>From decimal:</b> ÷ base for the integer part (remainders ↑), × base for the fraction (digits ↓).</li>
  <li style="font-size:1.4rem;margin:8px 0"><b>Binary ↔ octal / hex:</b> group the bits in 3s / 4s.  <b>Octal ↔ hex:</b> go through binary.</li></ul>`});
 out.forEach((s,i)=>{});
 return out;
}

function buildCv(p){
 const f=S.from,t=S.to,fb=SYS[f].b,tb=SYS[t].b,hasF=p.fp.length>0;
 const route=t==='dec'?'todec':f==='dec'?'fromdec':f==='bin'?'group':t==='bin'?'expand':'via';
 return{f,t,fb,tb,p,hasF,route,names:[]};
}

/* ================= Navigation / presentation layer ================= */
const names0=()=>Cv&&Cv.names?Cv.names:[];
function stepper(k){return`<div class="stp">${names0().map((x,i)=>`<button data-st="${i+1}" class="stc ${i+1<k?'done':i+1===k?'now':''}">${i+1<k?'\u2713 ':(i+1)+' '}${x}</button>`).join('')}</div>`}
function startDesign(){const c=selCheck();if(!c.ok)return false;Cv=buildCv(c.p);SL=SL.slice(0,selIdx+1).concat(designSlides());fillJump();return true}
function fillJump(){$('#jump').innerHTML=SL.map((s,i)=>s.t?`<option value="${i}">${i}. ${s.t}</option>`:'').join('')}
let heroT=null;
function heroStart(){clearInterval(heroT);let c=0;heroT=setInterval(()=>{c=(c+1)&15;document.querySelectorAll('#hero .led').forEach((l,k)=>l.classList.toggle('hi',!!((c>>(3-k))&1)));const t=document.getElementById('heroN');if(t)t.textContent=`BIN ${bin(c,4)} · OCT ${c.toString(8)} · DEC ${c} · HEX ${c.toString(16).toUpperCase()}`},800)}
function fit(){const sc=$('#sc');if(!sc)return;sc.style.transform='';sc.style.width='';const k=Math.min(1,822/sc.scrollHeight,1488/Math.max(sc.scrollWidth,1488));if(k<1){sc.style.transform=`scale(${k})`;sc.style.transformOrigin='top left';sc.style.width=(100/k)+'%'}}
function scaleSlide(){const w=$('#wrap').clientWidth,h=$('#wrap').clientHeight,k=Math.min(w/1600,h/900),s=$('#slide');s.style.transform=`scale(${k})`;s.style.left=(w-1600*k)/2+'px';s.style.top=(h-900*k)/2+'px'}
function render(){const sl=SL[pos.s],st=$('#stage'),ch=pos.s!==lastS;st.classList.toggle('enter',ch);lastS=pos.s;
 st.innerHTML=`<div id="sc">${sl.st?stepper(sl.st):''}${sl.t?`<h1>${sl.t}</h1>`:''}${sl.f(pos.u)}</div>`;$('#jump').value=pos.s;
 $('#prog').textContent=`Slide ${pos.s+1}/${SL.length} \u00b7 step ${pos.u+1}/${sl.n}`;$('#fill').style.width=((pos.s+(pos.u+1)/sl.n)/SL.length*100)+'%';$('#sn').textContent=`${pos.s+1} / ${SL.length}`;
 clearInterval(heroT);if(pos.s===0)heroStart();try{fit()}catch(e){}}
function tryStart(){if(!selCheck().ok){stopAuto();render();const h=$('#hint');if(h)h.classList.add('warn');return false}startDesign();pos={s:selIdx+1,u:0};render();return true}
function next(){const sl=SL[pos.s];if(sl.key==='select'){if(autoT)stopAuto();else tryStart();return}if(pos.u<sl.n-1)pos.u++;else if(pos.s<SL.length-1){pos.s++;pos.u=0}else stopAuto();render()}
function prev(){if(pos.u>0)pos.u--;else if(pos.s>0){pos.s--;pos.u=SL[pos.s].n-1}render()}
function stopAuto(){clearInterval(autoT);autoT=null;$('#auto').textContent='\u25b6 Auto'}
$('#nx').onclick=next;$('#pv').onclick=prev;$('#all').onclick=()=>{pos.u=SL[pos.s].n-1;render()};
$('#auto').onclick=()=>{if(autoT)stopAuto();else{$('#auto').textContent='\u23f8 Pause';autoT=setInterval(next,1500)}};
$('#jump').onchange=e=>{pos={s:+e.target.value,u:0};render()};

/* ---- Theme ---- */
const theme=()=>{const r=document.documentElement;r.dataset.theme=r.dataset.theme==='light'?'dark':'light'};

/* ---- Full screen (top-left button, F key, footer button) ---- */
const FSE=()=>document.fullscreenElement||document.webkitFullscreenElement||document.msFullscreenElement;
function enterFS(){
 const el=document.documentElement,rq=el.requestFullscreen||el.webkitRequestFullscreen||el.msRequestFullscreen;
 if(!rq)return Promise.resolve(false);
 try{return Promise.resolve(rq.call(el,{navigationUI:'hide'})).then(()=>true).catch(()=>false)}catch(e){return Promise.resolve(false)}
}
function exitFS(){const d=document,ex=d.exitFullscreen||d.webkitExitFullscreen||d.msExitFullscreen;if(ex)ex.call(d)}
const full=()=>FSE()?exitFS():enterFS();
const fsTop=document.getElementById('fsTop');
function syncFsBtn(){const on=!!FSE();fsTop.textContent=on?'\u2715':'\u26F6';fsTop.title=on?'Exit full screen (F)':'Full screen (F)';$('#fs').textContent=on?'Exit full screen':'Fullscreen'}
['fullscreenchange','webkitfullscreenchange','MSFullscreenChange'].forEach(ev=>document.addEventListener(ev,()=>{syncFsBtn();scaleSlide();try{fit()}catch(e){}}));
fsTop.onclick=e=>{e.stopPropagation();full()};
$('#th').onclick=theme;$('#fs').onclick=full;
syncFsBtn();enterFS();

document.addEventListener('keydown',e=>{if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;const k=e.key.toLowerCase();
 if(e.key==='ArrowRight'||k===' '||e.key==='PageDown'){e.preventDefault();next()}else if(e.key==='ArrowLeft'||e.key==='PageUp')prev();else if(k==='f')full();else if(k==='t')theme();else if(k==='h')document.body.classList.toggle('clean')});

$('#stage').addEventListener('click',e=>{const bt=e.target.closest('button'),d=bt?bt.dataset:{},id=bt?bt.id:'';if(!bt)return;
 if(d.st){const i=SL.findIndex(s=>s.st===+d.st);if(i>=0){pos={s:i,u:0};render()}return}
 if(id==='go'){tryStart();return}
 if(d.sf)S.from=d.sf;else if(d.sx)S.to=d.sx;
 else if(d.pre!==undefined){const x=PRE[+d.pre];S.val=x[0];S.from=x[1];S.to=x[2]}
 else return;
 SL=SL.slice(0,selIdx+1);fillJump();render()});
$('#stage').addEventListener('input',e=>{if(e.target.id==='nsv'){S.val=e.target.value;SL=SL.slice(0,selIdx+1);updateSel()}});
scaleSlide();addEventListener('resize',()=>{scaleSlide();try{fit()}catch(e){}});
SL=baseSlides();selIdx=SL.findIndex(s=>s.key==='select');fillJump();render();
</script></body></html>
